name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [offline, online]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name offline_player --org com.example.offlineplayer .

      - name: Disable broken Android lint check
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/no-lint.gradle <<'EOF'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital') || t.name.startsWith('lintAnalyze')) {
                t.enabled = false
              }
            }
          }
          EOF

      - name: Prepare Android manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          find android -name AndroidManifest.xml -exec sed -i '/android.permission.INTERNET/d' {} +
          sed -i 's/android:label="[^"]*"/android:label="StreamBridge"/' "$M"
          sed -i 's#<manifest#<manifest xmlns:tools="http://schemas.android.com/tools" #' "$M"
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <application#' "$M"
          if [ "${{ matrix.variant }}" = "online" ]; then
            NET='<uses-permission android:name="android.permission.INTERNET" />'
          else
            NET='<uses-permission android:name="android.permission.INTERNET" tools:node="remove" />'
          fi
          sed -i "s#<application#$NET\n    <application#" "$M"
          grep -q "READ_MEDIA_VIDEO" "$M" || { echo "Manifest edit failed"; exit 1; }
          grep -q "MANAGE_EXTERNAL_STORAGE" "$M" || { echo "Manifest edit failed"; exit 1; }
          grep -q "permission.INTERNET" "$M" || { echo "Manifest edit failed"; exit 1; }

      - name: Add native helpers (picture-in-picture, background play)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          MA=$(find android/app/src/main -name MainActivity.kt | head -n 1)
          [ -n "$MA" ] || { echo "MainActivity.kt not found"; exit 1; }
          DIR=$(dirname "$MA")
          PKG=$(grep -m1 '^package ' "$MA" | sed 's/^package //' | tr -d '\r ')
          echo "Package: $PKG"

          cat > "$MA" <<KT
          package $PKG

          import android.app.PictureInPictureParams
          import android.content.Intent
          import android.os.Build
          import android.util.Rational
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              private var autoPip = false

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (autoPip && Build.VERSION.SDK_INT >= 26) {
                      try {
                          val params = PictureInPictureParams.Builder()
                              .setAspectRatio(Rational(16, 9))
                              .build()
                          enterPictureInPictureMode(params)
                      } catch (e: Exception) {
                      }
                  }
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "offline/native")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "pip" -> {
                                  var ok = false
                                  try {
                                      if (Build.VERSION.SDK_INT >= 26) {
                                          val params = PictureInPictureParams.Builder()
                                              .setAspectRatio(Rational(16, 9))
                                              .build()
                                          ok = enterPictureInPictureMode(params)
                                      }
                                  } catch (e: Exception) {
                                      ok = false
                                  }
                                  result.success(ok)
                              }
                              "autoPip" -> {
                                  autoPip = (call.argument<Boolean>("on") == true)
                                  result.success(true)
                              }
                              "keepAlive" -> {
                                  try {
                                      val i = Intent(this, KeepAliveService::class.java)
                                      if (Build.VERSION.SDK_INT >= 26) {
                                          startForegroundService(i)
                                      } else {
                                          startService(i)
                                      }
                                  } catch (e: Exception) {
                                  }
                                  result.success(true)
                              }
                              "release" -> {
                                  try {
                                      stopService(Intent(this, KeepAliveService::class.java))
                                  } catch (e: Exception) {
                                  }
                                  result.success(true)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }
          }
          KT

          cat > "$DIR/KeepAliveService.kt" <<KT
          package $PKG

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder

          class KeepAliveService : Service() {
              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val channelId = "offline_player_playback"
                  if (Build.VERSION.SDK_INT >= 26) {
                      val nm = getSystemService(NotificationManager::class.java)
                      nm.createNotificationChannel(
                          NotificationChannel(channelId, "Playback", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val builder = if (Build.VERSION.SDK_INT >= 26) {
                      Notification.Builder(this, channelId)
                  } else {
                      Notification.Builder(this)
                  }
                  val n = builder
                      .setContentTitle("StreamBridge")
                      .setContentText("Playing in background")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .setOngoing(true)
                      .build()
                  try {
                      if (Build.VERSION.SDK_INT >= 29) {
                          startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PLAYBACK)
                      } else {
                          startForeground(1, n)
                      }
                  } catch (e: Exception) {
                      stopSelf()
                  }
                  return START_NOT_STICKY
              }
          }
          KT

          sed -i '0,/<activity/s//<activity android:supportsPictureInPicture="true"/' "$M"
          sed -i "s#</application>#    <service android:name=\"$PKG.KeepAliveService\" android:foregroundServiceType=\"mediaPlayback\" android:exported=\"false\" />\n    </application>#" "$M"
          grep -q "supportsPictureInPicture" "$M" || { echo "PiP manifest edit failed"; exit 1; }
          grep -q "KeepAliveService" "$M" || { echo "Service manifest edit failed"; exit 1; }
          cat "$M"

      - name: Force compileSdk 36 for all plugins
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts <<'EOF'

          fun forceCompileSdk(ext: Any) {
              val attempts = listOf(
                  "setCompileSdk" to java.lang.Integer::class.java,
                  "setCompileSdkVersion" to Int::class.javaPrimitiveType!!
              )
              for ((name, type) in attempts) {
                  try {
                      ext.javaClass.getMethod(name, type).invoke(ext, 36)
                      return
                  } catch (_: Exception) {
                  }
              }
          }

          subprojects {
              if (!state.executed) {
                  afterEvaluate {
                      val ext = extensions.findByName("android")
                      if (ext != null) forceCompileSdk(ext)
                  }
              }
          }
          EOF
            echo "Patched build.gradle.kts"
          elif [ -f android/build.gradle ]; then
            cat >> android/build.gradle <<'EOF'

          subprojects {
              if (!project.state.executed) {
                  afterEvaluate { p ->
                      if (p.hasProperty('android')) {
                          p.android.compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
            echo "Patched build.gradle"
          else
            echo "No root gradle file found"; exit 1
          fi

      - name: Set up release signing
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -f signing/release.jks ] && [ -n "$KS_PASS" ] && [ -f android/app/build.gradle.kts ]; then
            python3 - <<'PY'
          import os
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          ks = os.path.abspath('signing/release.jks')
          block = '''    signingConfigs {
              create("release") {
                  storeFile = file("%s")
                  storePassword = System.getenv("KS_PASS")
                  keyAlias = "offlineplayer"
                  keyPassword = System.getenv("KS_PASS")
                  storeType = "pkcs12"
              }
          }

          buildTypes {''' % ks
          s = s.replace('buildTypes {', block, 1)
          s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          open(p, 'w').write(s)
          print('release signing enabled')
          PY
            grep -n "release" android/app/build.gradle.kts || true
          else
            echo "No signing key found: using the debug key"
          fi

      - name: Get packages
        run: flutter pub get

      - name: Make the app icon
        continue-on-error: true
        run: |
          python3 tools/make_icon.py
          dart run flutter_launcher_icons -f flutter_launcher_icons-android.yaml

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: flutter build apk --release --dart-define=ONLINE=${{ matrix.variant == 'online' }}

      - name: Verify internet permission matches the variant
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee perms.txt
          if [ "${{ matrix.variant }}" = "offline" ]; then
            if grep -q "android.permission.INTERNET" perms.txt; then echo "INTERNET permission found in the OFFLINE APK"; exit 1; fi
          else
            grep -q "android.permission.INTERNET" perms.txt || { echo "ONLINE APK is missing INTERNET"; exit 1; }
          fi

      - name: Show signing certificate
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -n 5 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-player-android-${{ matrix.variant }}
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Windows project files
        run: flutter create --platforms=windows --project-name offline_player --org com.example.offlineplayer .

      - name: Get packages
        run: flutter pub get

      - name: Make the app icon and name
        continue-on-error: true
        run: |
          python tools/make_icon.py
          dart run flutter_launcher_icons -f flutter_launcher_icons-windows.yaml
          (Get-Content windows/runner/main.cpp) -replace 'L"offline_player"','L"StreamBridge"' | Set-Content windows/runner/main.cpp

      - name: Build Windows
        run: flutter build windows --release --dart-define=ONLINE=true

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: offline-player-windows
          path: build/windows/x64/runner/Release
