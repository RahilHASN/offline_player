name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name offline_player --org com.example.offlineplayer .

      - name: Prepare Android manifest
        run: |
          M=android/app/src/main/AndroidManifest.xml
          find android -name AndroidManifest.xml -exec sed -i '/android.permission.INTERNET/d' {} +
          sed -i 's/android:label="[^"]*"/android:label="Offline Player"/' "$M"
          sed -i 's#<manifest#<manifest xmlns:tools="http://schemas.android.com/tools" #' "$M"
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.INTERNET" tools:node="remove" />\n    <application#' "$M"
          grep -q "READ_MEDIA_VIDEO" "$M" || { echo "Manifest edit failed"; exit 1; }
          grep -q 'tools:node="remove"' "$M" || { echo "Manifest edit failed"; exit 1; }
          cat "$M"

      - name: Force compileSdk 36 for all plugins
        run: |
          if [ -f android/build.gradle.kts ]; then
            cat >> android/build.gradle.kts <<'EOF'

          fun forceCompileSdk(ext: Any) {
              val attempts = listOf(
                  "setCompileSdk" to java.lang.Integer::class.java,
                  "setCompileSdkVersion" to Int::class.javaPrimitiveType!!
              )
              for ((name, type) in attempts) {
                  try {
                      ext.javaClass.getMethod(name, type).invoke(ext, 36)
                      return
                  } catch (_: Exception) {
                  }
              }
          }

          subprojects {
              if (!state.executed) {
                  afterEvaluate {
                      val ext = extensions.findByName("android")
                      if (ext != null) forceCompileSdk(ext)
                  }
              }
          }
          EOF
            echo "Patched build.gradle.kts"
            tail -n 30 android/build.gradle.kts
          elif [ -f android/build.gradle ]; then
            cat >> android/build.gradle <<'EOF'

          subprojects {
              if (!project.state.executed) {
                  afterEvaluate { p ->
                      if (p.hasProperty('android')) {
                          p.android.compileSdkVersion 36
                      }
                  }
              }
          }
          EOF
            echo "Patched build.gradle"
          else
            echo "No root gradle file found"; exit 1
          fi

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Verify final APK has no internet permission
        run: |
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$AAPT2" dump permissions build/app/outputs/flutter-apk/app-release.apk | tee perms.txt
          if grep -q "android.permission.INTERNET" perms.txt; then echo "INTERNET permission found in APK"; exit 1; fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offline-player-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Generate Windows project files
        run: flutter create --platforms=windows --project-name offline_player --org com.example.offlineplayer .

      - name: Get packages
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: offline-player-windows
          path: build/windows/x64/runner/Release
