name: Create signing key

on: workflow_dispatch

permissions:
  contents: write

jobs:
  key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create keystore
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "Secret KEYSTORE_PASSWORD is missing"; exit 1; fi
          if [ -f signing/release.jks ]; then echo "Key already exists"; exit 0; fi
          mkdir -p signing
          keytool -genkeypair -keystore signing/release.jks -storetype PKCS12 -alias offlineplayer -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Offline Player, O=Personal, C=IN"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add signing/release.jks
          git commit -m "Add signing key"
          git push
