name: offline_player
description: StreamBridge media player.
publish_to: 'none'
version: 0.5.0+6

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.6.0
  file_picker: ^8.1.4
  shared_preferences: ^2.3.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  ffi: ^2.1.3
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  webview_flutter: ^4.9.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
